[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssr-unofficial"
version = "0.1.0"
description = "Unofficial Selection-Based Structured Reasoning inference and search harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "requests>=2.31"]

[project.optional-dependencies]
inference = ["sglang[all]==0.5.6", "transformers==4.57.1", "orjson>=3.9", "safetensors>=0.4"]
test = ["pytest>=8"]

[project.scripts]
ssr-infer = "ssr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssr = ["assets/*.json", "assets/*.txt", "assets/teaser/*.json", "assets/teaser/*.jpg", "assets/teaser/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
